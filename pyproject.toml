[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-agent"
version = "0.1.0"
description = "An AI agent that turns a plain-English request into a checked Excel and PowerPoint investment performance pack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "python-pptx>=0.6.23",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
